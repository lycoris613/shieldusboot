<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1장. 태그 · 요소 · 속성 · 중첩</title>
  </head>
  <body>

    <!-- ============================================
         태그의 생김새
         <p class="intro">안녕하세요</p>
          |   |            |          |
          |   |            |          +-- 닫는 태그
          |   |            +------------- 내용(content)
          |   +-------------------------- 속성(attribute)
          +------------------------------ 여는 태그
         ============================================ -->
    <p class="intro">안녕하세요</p>


    <!-- ============================================
         빈 요소 — 닫는 태그가 없는 태그
         ============================================ -->
    첫 줄<br />
    br 로 줄을 바꿨습니다.
    <hr />
    hr 로 구분선을 넣었습니다.


    <!-- ============================================
         중첩 — 태그 안에 태그
         ============================================ -->
    <div class="card">
      <h3>프로젝트 제목</h3>
      <p>설명 문구입니다.</p>
    </div>


    <!-- ============================================
         중첩 규칙 — 나중에 연 태그를 먼저 닫는다
         ============================================ -->
    <p><strong>굵게</strong></p>

    <!-- 아래처럼 순서가 엇갈리면 안 됩니다.
         <p><strong>굵게</p></strong> -->

  </body>
</html>
