<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6장. 폼(form)과 입력</title>
  </head>
  <body>

    <!-- ============================================
         폼의 기본 모양
           form 이 입력칸들을 하나로 묶는다
           label 의 for 와 input 의 id 를 같게 하면 글자를 눌러도 커서가 간다
           name 은 서버로 보낼 때의 키 이름
         ============================================ -->
    <form id="studentForm">

      <!-- type="text" — 한 줄 글자 -->
      <div>
        <label for="name">이름:</label><br />
        <input type="text" name="name" id="name" required />
      </div>

      <div>
        <label for="studentNumber">학번:</label><br />
        <input type="text" name="studentNumber" id="studentNumber" required />
      </div>

      <!-- placeholder — 비어 있을 때 흐리게 보이는 안내 글자 -->
      <!-- pattern — 이 형식이 아니면 브라우저가 막는다 -->
      <div>
        <label for="phoneNumber">전화번호:</label><br />
        <input type="tel" name="phoneNumber" id="phoneNumber"
               placeholder="010-1234-5678"
               pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}" />
      </div>

      <!-- type="email" — @ 가 없으면 브라우저가 막는다 -->
      <div>
        <label for="email">이메일:</label><br />
        <input type="email" name="email" id="email" placeholder="hong@test.com" />
      </div>

      <!-- type="date" — 달력이 뜬다 -->
      <div>
        <label for="dateOfBirth">생년월일:</label><br />
        <input type="date" name="dateOfBirth" id="dateOfBirth" />
      </div>

      <!-- type="number" — 숫자만 -->
      <div>
        <label for="score">점수:</label><br />
        <input type="number" name="score" id="score" min="0" max="100" />
      </div>

      <!-- type="password" — 글자가 가려진다 -->
      <div>
        <label for="pw">비밀번호:</label><br />
        <input type="password" name="pw" id="pw" />
      </div>

      <!-- select + option — 여럿 중 하나 고르기 -->
      <div>
        <label for="grade">학년:</label><br />
        <select name="grade" id="grade">
          <option value="">선택하세요</option>
          <option value="1">1학년</option>
          <option value="2">2학년</option>
          <option value="3">3학년</option>
        </select>
      </div>

      <!-- checkbox — 여러 개 고를 수 있다. name 이 같으면 한 묶음 -->
      <div>
        <span>관심 분야:</span><br />
        <label><input type="checkbox" name="interest" value="html" /> HTML</label>
        <label><input type="checkbox" name="interest" value="css" /> CSS</label>
        <label><input type="checkbox" name="interest" value="js" /> JavaScript</label>
      </div>

      <!-- radio — name 이 같은 것 중 하나만 골라진다 -->
      <div>
        <span>수강 형태:</span><br />
        <label><input type="radio" name="type" value="online" /> 온라인</label>
        <label><input type="radio" name="type" value="offline" /> 오프라인</label>
      </div>

      <!-- textarea — 여러 줄 글자. 빈 요소가 아니므로 닫는 태그가 있다 -->
      <div>
        <label for="memo">메모:</label><br />
        <textarea name="memo" id="memo" rows="3"></textarea>
      </div>

      <!-- button 의 type
             submit  폼을 제출한다 (type 을 안 쓰면 이것이 기본값)
             button  아무 일도 하지 않는다. JavaScript 를 붙여 쓴다
             reset   폼을 비운다
         ============================================ -->
      <div>
        <button type="submit">학생 등록</button>
        <button type="button">취소</button>
        <button type="reset">초기화</button>
      </div>

    </form>

  </body>
</html>
