<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>11장. useRef 와 커스텀 훅</title>

    <!-- bare specifier 를 CDN 주소로 연결한다. Vite 의 node_modules 해석을 대신하는 것 -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client"
        }
      }
    </script>
  </head>
  <body>

    <h1>11장. useRef 와 커스텀 훅</h1>
    <p>
      <a href="index.html">&larr; 목차</a> &middot;
      코드는 <code>js/ch11_useref.jsx</code> 에 있습니다. F12 &rarr; Console 을 함께 여세요.
    </p>
    <hr />

    <!-- React 가 그려 넣을 자리. index.html 이 이 한 줄만 갖는 것이 React 방식이다 -->
    <div id="root"></div>

    <!-- JSX 를 브라우저에서 바로 변환한다. 학습용이며 실무에서는 Vite 가 이 일을 한다 -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script type="text/babel" data-type="module" src="js/ch11_useref.jsx"></script>
  </body>
</html>
