<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6장. flex와 grid, 무엇을 쓸까</title>
    <link rel="stylesheet" href="css/ch06_flex_vs_grid.css" />
  </head>
  <body>

    <h1>6장. flex와 grid, 무엇을 쓸까</h1>
    <p><a href="index.html">&larr; 목차</a> &middot; 설명은 CSS_Flexbox_Grid_가이드.pdf 와 <code>css/ch06_flex_vs_grid.css</code> 주석을 보세요.</p>
    <hr />


    <!-- 줄 맞춤 비교 — 아이템이 5개라 마지막 줄에서 차이가 드러납니다 -->
    <p class="lbl">flex + wrap — 마지막 줄의 세로줄이 안 맞는다</p>
    <div class="cmp-flex"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i></div>

    <p class="lbl">grid — 언제나 세로줄이 맞는다</p>
    <div class="cmp-grid"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i></div>

    <!-- 함께 쓰기 : 큰 구조는 grid, 그 안의 배치는 flex -->
    <p class="lbl">grid 아이템 안에 다시 flex — 매우 흔한 패턴</p>
    <div class="page">
      <div class="p-side">grid 로 잡은 사이드바</div>
      <div class="p-main">
        <div class="p-header"><span>로고</span><span>메뉴</span></div>
        <p>헤더 내부는 flex 로 배치했습니다.</p>
      </div>
    </div>

  </body>
</html>
