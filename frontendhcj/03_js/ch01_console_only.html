<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1장. JavaScript 붙이기와 콘솔</title>
  </head>
  <body>

    <h1>1장. JavaScript 붙이기와 콘솔</h1>
    <p>
      <a href="index.html">&larr; 목차</a> &middot;
      코드는 <code>js/ch01_console.js</code> 에 있습니다. F12 &rarr; Console 을 함께 여세요.
    </p>
    <hr />

    <!-- console.log · error · table 을 눌러 Console 탭과 비교하세요 -->
    <p>
      <button type="button" id="btnLog">console.log</button>
      <button type="button" id="btnError">console.error</button>
      <button type="button" id="btnTable">console.table</button>
      <button type="button" id="btnClear">지우기</button>
    </p>

    <!-- 실행 결과 — assets/demo.js 의 out() 이 여기에 찍는다 -->
    <h2>실행 결과</h2>
    <pre id="output"></pre>

    <!-- out() · outClear() 헬퍼가 먼저 와야 한다 -->
    <script src="../assets/demo.js"></script>
    <script src="js/ch01_console.js"></script>
  </body>
</html>
