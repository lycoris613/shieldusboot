<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10장. 이벤트 — 사용자 동작에 반응하기</title>
  </head>
  <body>

    <h1>10장. 이벤트 — 사용자 동작에 반응하기</h1>
    <p>
      <a href="index.html">&larr; 목차</a> &middot;
      코드는 <code>js/ch10_event.js</code> 에 있습니다. F12 &rarr; Console 을 함께 여세요.
    </p>
    <hr />

    <!-- submit : preventDefault 가 있고 없고의 차이.
         아래 "preventDefault 없음" 을 누르면 페이지가 새로고침됩니다. -->
    <form id="goodForm">
      <input type="text" name="name" value="홍길동" />
      <button type="submit">preventDefault 있음</button>
    </form>

    <form id="badForm">
      <input type="text" name="name" value="홍길동" />
      <button type="submit">preventDefault 없음</button>
    </form>

    <hr />

    <!-- input : 글자를 칠 때마다 / change : 값이 바뀌고 포커스가 떠날 때 -->
    <p><input type="text" id="typeInput" placeholder="여기에 글자를 쳐 보세요" /></p>

    <p>
      <select id="selectDemo">
        <option value="">선택하세요</option>
        <option value="1">1학년</option>
        <option value="2">2학년</option>
      </select>
    </p>

    <p><button type="button" id="clickDemo">click</button></p>

    <!-- 실행 결과 — assets/demo.js 의 out() 이 여기에 찍는다 -->
    <h2>실행 결과</h2>
    <pre id="output"></pre>

    <!-- out() · outClear() 헬퍼가 먼저 와야 한다 -->
    <script src="../assets/demo.js"></script>
    <script src="js/ch10_event.js"></script>
  </body>
</html>
