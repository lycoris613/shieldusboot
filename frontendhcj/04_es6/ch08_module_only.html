<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8장. 모듈 — export 와 import</title>
  </head>
  <body>

    <h1>8장. 모듈 — export 와 import</h1>
    <p>
      <a href="index.html">&larr; 목차</a> &middot;
      코드는 <code>js/ch08_module.js</code> 에 있습니다. F12 &rarr; Console 을 함께 여세요.
    </p>
    <hr />

    <!-- js/ch08_module.js 가 js/mortgage.js 를 import 합니다.
         그래서 script 태그에 type="module" 이 붙어 있습니다.
         빠뜨리면 "Cannot use import statement outside a module" 이 납니다. -->
    <p>
      원금
      <input type="number" id="principal" value="30000000" step="1000000" />
      원 &nbsp; 연이율
      <input type="number" id="rate" value="5" step="0.1" />
      % &nbsp; 기간
      <input type="number" id="years" value="3" />
      년
    </p>
    <p>
      <button type="button" id="btnCalc">모듈 함수로 계산</button>
      <button type="button" id="btnClear">지우기</button>
    </p>

    <!-- 실행 결과 — assets/demo.js 의 out() 이 여기에 찍는다 -->
    <h2>실행 결과</h2>
    <pre id="output"></pre>

    <!-- out() · outClear() 헬퍼가 먼저 와야 한다 -->
    <script src="../assets/demo.js"></script>
    <script type="module" src="js/ch08_module.js"></script>
  </body>
</html>
