<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12장. 반응형과 미디어 쿼리</title>
    <!-- 반응형의 출발점 — 이 meta 가 없으면 미디어 쿼리가 동작하지 않습니다.
         (위 head 의 viewport 줄이 바로 그것입니다) -->

    <link rel="stylesheet" href="css/ch12_responsive.css" />
  </head>
  <body>

    <h1>반응형과 미디어 쿼리</h1>

    <!-- 미디어 쿼리 : 창 너비를 줄여 보세요. 3열 → 2열 → 1열 -->
    <p class="width-label">현재 상태</p>
    <div class="resp">
      <i>①</i><i>②</i><i>③</i><i>④</i><i>⑤</i><i>⑥</i>
    </div>

    <hr />

    <!-- 미디어 쿼리 없이도 반응형 : auto-fit + minmax -->
    <p>아래는 @media 없이 grid 만으로 반응합니다.</p>
    <div class="resp-auto">
      <i>①</i><i>②</i><i>③</i><i>④</i><i>⑤</i><i>⑥</i>
    </div>
  </body>
</html>
