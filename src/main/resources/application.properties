spring.application.name=MySpringBootLabProject

# ===== 1-3) Environment variables (loaded by @Value / @ConfigurationProperties) =====
myprop.username=springboot
myprop.port=${random.int(1,100)}

# ===== Base-package log level for the default profile =====
# Overridden by application-prod.properties / application-test.properties (1-7)
logging.level.com.rookies6.myspringbootlab=INFO

# ===== 2-3) CORS allowed origins (comma-separated front-end dev servers) =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500
