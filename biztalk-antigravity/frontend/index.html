<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 말투 변환기</title>
<meta name="description" content="받는 사람에 맞춰 원문을 상사, 동료, 고객, 팀 말투로 바꿔주는 업무 커뮤니케이션 도구">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' fill='%23F5F4EF'/%3E%3Crect x='8' y='9' width='16' height='2' fill='%231C1C1A'/%3E%3Crect x='8' y='14' width='16' height='2' fill='%231C1C1A'/%3E%3Crect x='8' y='19' width='10' height='2' fill='%231C1C1A'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="page">
  <div class="receipt">

    <header class="receipt-head">
      <h1 class="brand">* * * 업무 말투 변환기 * * *</h1>
      <p class="meta">발행일 <span id="issueDate">----.--.--</span>&nbsp;&nbsp;NO.<span id="issueNo">0001</span></p>
    </header>

    <form id="convertForm" class="ticket-form" novalidate>

      <section class="line-item">
        <p class="item-label">원문 입력</p>
        <textarea
          id="inputText"
          name="inputText"
          class="textarea"
          rows="5"
          maxlength="1000"
          placeholder="예: 내일까지 보고서 제출 어려울 것 같음"
          required
        ></textarea>
        <p class="char-count" id="charCount">0 / 500</p>
      </section>

      <p class="divider" aria-hidden="true"></p>

      <section class="line-item">
        <p class="item-label" id="targetLabel">수신 대상</p>
        <div class="target-group" role="group" aria-labelledby="targetLabel">
          <button type="button" class="target-btn" data-target="boss" aria-pressed="false">
            <span class="checkbox" aria-hidden="true">[&nbsp;]</span>
            <span class="target-label">상사</span>
            <span class="target-desc">격식있게</span>
          </button>
          <button type="button" class="target-btn" data-target="colleague" aria-pressed="false">
            <span class="checkbox" aria-hidden="true">[&nbsp;]</span>
            <span class="target-label">타팀 동료</span>
            <span class="target-desc">정중하게</span>
          </button>
          <button type="button" class="target-btn" data-target="client" aria-pressed="false">
            <span class="checkbox" aria-hidden="true">[&nbsp;]</span>
            <span class="target-label">고객</span>
            <span class="target-desc">신뢰감있게</span>
          </button>
          <button type="button" class="target-btn" data-target="team" aria-pressed="false">
            <span class="checkbox" aria-hidden="true">[&nbsp;]</span>
            <span class="target-label">팀 동료</span>
            <span class="target-desc">간결하게</span>
          </button>
        </div>
      </section>

      <p class="divider divider-heavy" aria-hidden="true"></p>

      <button type="submit" class="btn-print" id="convertBtn">
        &lt;&nbsp;<span id="convertBtnLabel">변 환 하 기</span>&nbsp;&gt;
      </button>
      <p class="status-message" id="statusMessage" role="alert" aria-live="polite"></p>

    </form>

    <p class="divider divider-heavy" aria-hidden="true"></p>

    <section class="line-item result-section" aria-labelledby="result-title">
      <p class="item-label" id="result-title">결과</p>
      <div class="printout" id="resultOutput">
        <p class="empty-state" id="emptyState">원문을 입력하고 &lt;변환하기&gt;를 누르면<br>여기에 인쇄됩니다.</p>
        <p class="result-text" id="resultText" hidden></p>
      </div>
      <button type="button" class="btn-copy" id="copyBtn" disabled>[ 복사하기 ]</button>
    </section>

    <p class="divider" aria-hidden="true"></p>

    <div class="barcode" aria-hidden="true"></div>
    <p class="thanks">감 사 합 니 다</p>

  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
